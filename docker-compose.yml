services:
  postgres:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://orders:orders@postgres:5432/orders?sslmode=disable"
      - "up"

  redis:
    image: redis:7-alpine
    profiles: ["tools"]
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["tools"]
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://localhost:19092
    ports:
      - "19092:19092"

volumes:
  pgdata:
