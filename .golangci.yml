# Линтер для CI. Набор намеренно короткий: три линтера, которые ловят
# то, что не ловит компилятор и тесты.
#
# Формат v2 (golangci-lint >= 2). Версия v1.64.8 здесь не работает: она
# собрана с Go 1.24, а модуль и его зависимости (grpc, x/net) требуют Go 1.26 —
# типизация падала на файлах с //go:build go1.26.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    # govet — подозрительный код: забытые структуры в %v, копирование мьютексов,
    # неверные форматы Printf, потерянные аргументы context.
    - govet
    # errcheck — проигнорированные ошибки. В этом сервисе важно: пропущенный
    # Rollback/Close/MarkPublished означает потерянное задание или утечку.
    - errcheck
    # staticcheck — мёртвый код, бесполезные проверки, ошибки вида use of closed
    # connection, неверные преобразования типов.
    - staticcheck

issues:
  # Не раздуваем лимит: если накопилось больше 100 замечаний, лучше чинить пачками.
  max-issues-per-linter: 100
  max-same-issues: 10
