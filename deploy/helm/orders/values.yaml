# Вариант B: два API, publisher в каждом. Строки outbox делят через publish_locked_at.
replicaCount: 2

image:
  repository: order-service
  tag: latest
  pullPolicy: IfNotPresent

# Несекретные переменные окружения сервиса.
env:
  HTTP_ADDR: ":8080"
  CATALOG_GRPC_ADDR: "catalogfake:9091"
  REDIS_ADDR: "redis:6379"
  PRICE_CACHE_TTL: "60s"
  ERP_BASE_URL: "http://erpfake:8081"
  KAFKA_ADDR: "redpanda:19092"
  KAFKA_TOPIC: "order.created"
  POLL_INTERVAL: "1s"
  POLL_IDLE: "1s"

# DATABASE_URL содержит пароль, поэтому берётся из Secret, а не из values.
databaseURL:
  secretName: orders-secrets
  secretKey: database-url

# Порт HTTP внутри контейнера (должен совпадать с HTTP_ADDR).
containerPort: 8080

podAnnotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
