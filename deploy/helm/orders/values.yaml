# Вариант B (C3): api.replicas = 2 — publisher работает в каждом экземпляре API.
# Строки outbox экземпляры делят через publish_locked_at (lease 60s)
# и FOR UPDATE SKIP LOCKED, поэтому одно событие не публикуется дважды
# одновременно (at-least-once остаётся: повтор возможен только после падения
# между записью в Kafka и простановкой published_at).

image:
  repository: order-service
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  containerPort: 8080
  grpcPort: 9090
  terminationGracePeriodSeconds: 15

  # Несекретные переменные окружения. DATABASE_URL берётся из Secret.
  env:
    HTTP_ADDR: ":8080"
    GRPC_ADDR: ":9090"
    CATALOG_GRPC_ADDR: "catalogfake:9091"
    REDIS_ADDR: "redis:6379"
    PRICE_CACHE_TTL: "60s"
    ERP_BASE_URL: "http://erpfake:8081"
    ERP_TIMEOUT: "15s"
    ERP_LIMIT: "10"
    ERP_WINDOW: "1s"
    REAPER_AFTER: "30s"
    REAPER_EVERY: "10s"
    KAFKA_ADDR: "redpanda:19092"
    KAFKA_TOPIC: "order.created"
    POLL_INTERVAL: "1s"
    POLL_IDLE: "1s"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"

  probes:
    path: /healthz
    startup:
      periodSeconds: 2
      failureThreshold: 30
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  resources: {}

worker:
  replicas: 2
  # Порт служебного HTTP: /healthz и /debug/pprof.
  healthPort: 8082
  # Больше SHUTDOWN_TIMEOUT (20s): kubelet успевает дождаться штатного выхода.
  terminationGracePeriodSeconds: 30
  # Пусто — берётся Service API этого релиза: <release>-api:<api.grpcPort>.
  jobsAddr: ""

  # Базы данных у воркера нет: только gRPC-очередь и ERP.
  env:
    ERP_BASE_URL: "http://erpfake:8081"
    WORKER_PPROF_ADDR: ":8082"
    POLL_IDLE: "1s"
    RPC_DEADLINE: "5s"
    SHUTDOWN_TIMEOUT: "20s"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"

  probes:
    path: /healthz
    startup:
      periodSeconds: 2
      failureThreshold: 15
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  resources: {}

# DATABASE_URL содержит пароль, поэтому берётся из Secret, а не из values.
databaseURL:
  secretName: orders-secrets
  secretKey: database-url

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
